data:
  raw_path: data/raw/Mental_Health_Lifestyle_Dataset.csv
  target_column: Mental Health Condition

split:
  test_size: 0.2
  val_size: 0.1
  random_state: 42

features:
  numeric:
    - Age
    - Sleep Hours
    - Work Hours per Week
    - Screen Time per Day (Hours)
    - Social Interaction Score
    - Happiness Score
  ordinal:
    - Exercise Level
    - Stress Level
  categorical:
    - Gender
    - Diet Type
    - Country
  engineered:
    - sleep_debt
    - screen_overload
    - work_intensity

model:
  name: xgboost
  params:
    n_estimators: 300
    learning_rate: 0.1
    max_depth: 5
    eval_metric: mlogloss
    random_state: 42
    n_jobs: -1

optuna:
  n_trials: 50
  metric: f1_macro
  direction: maximize

mlflow:
  experiment_name: mental-health-predictor

paths:
  model_dir: app/model
  model_file: app/model/model.pkl
  encoder_file: app/model/label_encoder.pkl
  feature_names_file: app/model/feature_names.pkl
  encoders_file: app/model/encoders.pkl
